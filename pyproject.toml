[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-test-runner"
version = "0.1.0"
description = "Run test suites as isolated Kubernetes Jobs behind a small, stateless API and dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sujyonta Kumar Giri" }]
keywords = ["kubernetes", "test-automation", "devops", "jobs", "fastapi", "qa", "platform-engineering"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "kubernetes>=29.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
ktr-server = "k8s_test_runner.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k8s_test_runner = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
