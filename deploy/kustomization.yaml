apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-runner
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - policies.yaml
configMapGenerator:
  - name: ktr-suites
    files:
      - suites.yaml
# The API token Secret is deliberately not in git. Create it first:
#   kubectl -n test-runner create secret generic ktr-api-token --from-literal=token="$(openssl rand -hex 24)"
